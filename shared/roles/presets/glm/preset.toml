# GLM 预设：ZCode 6 角色绑定 GLM-5.3-Flash / GLM-5.4。
# ZCode 的 providerId/modelId 随账号与套餐变化，预设只写 local:<key>；
# 安装时从 ~/.ai-vibecode-superpower/model-bindings.toml 的 [zcode] 小节解析实际值。
description = "GLM 预设：ZCode 6 角色绑定 GLM-5.3-Flash / GLM-5.4。"

[zcode]
model = "local:glm_flash"

[[zcode.role]]
id = "flash_low"
name = "glm_5.3_flash_low"
description = "只读常规取证与实施后预审。"
effort = "basic"
readonly = true
color = "cyan"

[[zcode.role]]
id = "flash_high"
name = "glm_5.3_flash_high"
description = "只读深度取证与复杂预审。"
effort = "deep"
readonly = true
color = "cyan"

[[zcode.role]]
id = "flash_max"
name = "glm_5.3_flash_max"
description = "写代码主力：受控契约执行、受保护写入、共享状态处理与集成。"
effort = "max"
readonly = false
color = "green"

[[zcode.role]]
id = "review_high"
name = "glm_5.4_high"
description = "只读有界技术定案与常规复审（审核主力）。"
effort = "deep"
readonly = true
color = "purple"
model = "local:glm_main"

[[zcode.role]]
id = "review_max"
name = "glm_5.4_max"
description = "只读最高强度独立复审与最终升级验收（终审）。"
effort = "max"
readonly = true
color = "orange"
model = "local:glm_main"

[[zcode.role]]
id = "design_high"
name = "glm_5.4_design_high"
description = "界面设计定案与设计复审：实现前定结构、组件与主任务脚本，实现后按用户走查和缺陷清单看截图复审；只报告问题和修改方向，不改界面和项目代码。"
skill_desc = "界面设计定案与设计复审；界面渲染有新增或改动时使用，不参与通用取证、复审与写入的回退。"
effort = "deep"
readonly = false
color = "pink"
model = "local:glm_main"
