interface:
  display_name: "安全审计"
  short_description: "Evidence-gated source audit with attack-surface recon, sink tracing, refutation, and a coverage ledger"
  default_prompt: "使用 $security-audit 对目标项目做取证式安全审计：先测绘攻击面与授权模型，再追踪攻击路径，逐条用适用层的可复核证据证实或证伪，输出含覆盖台账的报告；不要将缺少完整证据的线索写成确认漏洞。"
policy:
  allow_implicit_invocation: true
